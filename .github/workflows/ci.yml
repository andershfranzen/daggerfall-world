name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run test suite
        run: npm test

  deploy-game:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_WEBSITE_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger website deploy via repository_dispatch
        env:
          DEPLOY_WEBSITE_REPO: ${{ vars.DEPLOY_WEBSITE_REPO }}
          DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          GAME_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_DISPATCH_TOKEN" ]; then
            echo "DEPLOY_DISPATCH_TOKEN secret is not configured; skipping deploy-game dispatch."
            exit 0
          fi
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOY_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOY_WEBSITE_REPO}/dispatches" \
            -d "{\"event_type\":\"deploy-game\",\"client_payload\":{\"game_ref\":\"${GAME_REF}\"}}"
